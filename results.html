<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236366f1'/%3E%3Ctext x='32' y='44' font-size='38' font-family='Segoe UI,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
    <title>Exam Results — Raj School</title>
    <link rel="preload" as="image" href="assets/img/library-books.webp">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="grid-bg" data-page="results">
    <div id="app-shell"></div>

    <main class="content">
        <div class="academia-banner no-print">
            <svg class="academia-books" viewBox="0 0 300 122" aria-hidden="true">
                <g>
                    <rect x="6" y="38" width="16" height="84" rx="2" fill="#b45309"/>
                    <rect x="26" y="24" width="14" height="98" rx="2" fill="#92400e"/>
                    <rect x="44" y="52" width="18" height="70" rx="2" fill="#d97706"/>
                    <rect x="66" y="16" width="12" height="106" rx="2" fill="#78350f"/>
                    <rect x="82" y="46" width="20" height="76" rx="2" fill="#f59e0b"/>
                    <rect x="106" y="30" width="14" height="92" rx="2" fill="#a16207"/>
                    <rect x="124" y="58" width="22" height="64" rx="2" fill="#b45309"/>
                    <rect x="150" y="20" width="15" height="102" rx="2" fill="#d97706"/>
                    <rect x="169" y="44" width="19" height="78" rx="2" fill="#78350f"/>
                    <rect x="192" y="34" width="13" height="88" rx="2" fill="#f59e0b"/>
                    <rect x="209" y="60" width="21" height="62" rx="2" fill="#92400e"/>
                    <rect x="234" y="26" width="16" height="96" rx="2" fill="#a16207"/>
                    <rect x="254" y="48" width="18" height="74" rx="2" fill="#b45309"/>
                    <rect x="276" y="36" width="14" height="86" rx="2" fill="#d97706"/>
                    <rect x="0" y="112" width="300" height="10" rx="3" fill="#3f2a14"/>
                </g>
                <g fill="#fef3c7" opacity="0.75">
                    <rect x="10" y="50" width="8" height="3"/>
                    <rect x="30" y="38" width="6" height="3"/>
                    <rect x="86" y="62" width="12" height="3"/>
                    <rect x="130" y="72" width="10" height="3"/>
                    <rect x="154" y="38" width="7" height="3"/>
                    <rect x="213" y="74" width="13" height="3"/>
                    <rect x="238" y="42" width="8" height="3"/>
                    <rect x="258" y="62" width="10" height="3"/>
                </g>
            </svg>
            <div style="position:relative;z-index:2;max-width:640px;">
                <span class="eyebrow">📚 Academic Archive · Dark Academia</span>
                <h2>Exam Results &amp; Report Card</h2>
                <p class="muted small" style="margin:0;">Digital ID card, subject marks and printable marksheet preserved in one academic archive.</p>
            </div>
            <div class="academia-actions">
                <button class="btn btn-outline" id="editBtn" onclick="openMarksModal()">✏️ Edit Marks</button>
                <button class="btn btn-primary" onclick="window.print()">🖨️ Print Marksheet</button>
            </div>
        </div>

        <div class="toolbar no-print">
            <select id="studentSelect" onchange="renderReportCard()" style="min-width:280px;"></select>
        </div>

        <div class="id-grid" id="reportArea"></div>
    </main>

    <div class="modal" id="marksModal">
        <div class="modal-box">
            <h3 style="margin-bottom:18px;">Update Exam Marks</h3>
            <form onsubmit="saveMarks(event)">
                <div class="form-grid">
                    <div class="form-group"><label>Mathematics / 100</label><input id="mMath" type="number" min="0" max="100" required></div>
                    <div class="form-group"><label>Science / 100</label><input id="mScience" type="number" min="0" max="100" required></div>
                    <div class="form-group"><label>Computer Science / 100</label><input id="mCs" type="number" min="0" max="100" required></div>
                    <div class="form-group"><label>English / 100</label><input id="mEnglish" type="number" min="0" max="100" required></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('marksModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Marks</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const user = getUser();
        const canEdit = user && ['Admin', 'Teacher'].includes(user.role);
        if (!canEdit) document.getElementById('editBtn').style.display = 'none';

        const select = document.getElementById('studentSelect');
        const students = getStudents();
        select.innerHTML = students.map(s =>
            `<option value="${esc(s.roll)}">${esc(s.roll)} — ${esc(s.name)} (${esc(s.class)})</option>`
        ).join('') || '<option value="">No students</option>';

        const SUBJECTS = [
            { key: 'math', label: 'Mathematics' },
            { key: 'science', label: 'Science' },
            { key: 'cs', label: 'Computer Science' },
            { key: 'english', label: 'English' }
        ];

        function gradeFor(marks) {
            if (marks >= 90) return 'A+';
            if (marks >= 80) return 'A';
            if (marks >= 70) return 'B+';
            if (marks >= 60) return 'B';
            if (marks >= 50) return 'C';
            if (marks >= 33) return 'D';
            return 'F';
        }

        function attendancePct(roll) {
            const log = getAttendanceLog().filter(x => x.roll === roll);
            if (!log.length) return null;
            return Math.round(log.filter(x => x.status === 'Present').length / log.length * 100);
        }

        function currentStudent() {
            return getStudents().find(s => s.roll === select.value);
        }

        function renderReportCard() {
            const s = currentStudent();
            const area = document.getElementById('reportArea');
            if (!s) { area.innerHTML = '<div class="glass-panel empty"><span>🎓</span>No student selected.</div>'; return; }

            const marks = s.marks || { math: 0, science: 0, cs: 0, english: 0 };
            const total = SUBJECTS.reduce((sum, sub) => sum + Number(marks[sub.key] || 0), 0);
            const pct = (total / (SUBJECTS.length * 100) * 100).toFixed(1);
            const passed = pct >= 33 && SUBJECTS.every(sub => Number(marks[sub.key] || 0) >= 33);
            const att = attendancePct(s.roll);
            const attendanceText = att === null ? (s.attendance === 'Present' ? '96.4%' : '88.0%') : att + '%';

            area.innerHTML = `
                <div class="digital-id">
                    <div class="avatar">${esc(initials(s.name))}</div>
                    <span class="badge badge-paid" style="margin-bottom:10px;">● ACTIVE STUDENT</span>
                    <h3 style="margin-bottom:4px;">${esc(s.name)}</h3>
                    <p class="muted small" style="margin-bottom:16px;">Class ${esc(s.class)} · Section ${esc(String(s.class).split('-')[1] || 'A')}</p>
                    <div class="id-row"><span>Roll Number</span><strong>${esc(s.roll)}</strong></div>
                    <div class="id-row"><span>Attendance</span><strong style="color:var(--success)">${attendanceText}</strong></div>
                    <div class="id-row"><span>Fee Status</span><strong>${esc(s.feeStatus)}</strong></div>
                    <div class="id-row" style="border-bottom:0"><span>Guardian Contact</span><strong>${esc(s.phone)}</strong></div>
                </div>

                <div class="glass-panel" style="margin:0;">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border-glass);padding-bottom:14px;margin-bottom:6px;">
                        <div>
                            <h3>Raj School — Academic Marksheet</h3>
                            <p class="muted small">Term Examination · ${esc(new Date().getFullYear())}–${esc(String(new Date().getFullYear() + 1).slice(2))}</p>
                        </div>
                        <span class="badge ${passed ? 'badge-paid' : 'badge-danger'}">${passed ? 'PASS' : 'FAIL'} (${pct}%)</span>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead><tr><th>Subject</th><th>Max Marks</th><th>Obtained</th><th>Grade</th></tr></thead>
                            <tbody>
                                ${SUBJECTS.map(sub => `
                                    <tr><td>${sub.label}</td><td>100</td><td><strong>${Number(marks[sub.key] || 0)}</strong></td><td>${gradeFor(Number(marks[sub.key] || 0))}</td></tr>
                                `).join('')}
                                <tr>
                                    <td><strong>Total</strong></td>
                                    <td><strong>${SUBJECTS.length * 100}</strong></td>
                                    <td><strong>${total} (${pct}%)</strong></td>
                                    <td><strong>${passed ? gradeFor(Number(pct)) : 'F'}</strong></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        function openMarksModal() {
            const s = currentStudent();
            if (!s) return;
            const m = s.marks || {};
            document.getElementById('mMath').value = m.math ?? 0;
            document.getElementById('mScience').value = m.science ?? 0;
            document.getElementById('mCs').value = m.cs ?? 0;
            document.getElementById('mEnglish').value = m.english ?? 0;
            openModal('marksModal');
        }

        function saveMarks(event) {
            event.preventDefault();
            const all = getStudents();
            const s = all.find(x => x.roll === select.value);
            if (!s) return;
            s.marks = {
                math: Number(document.getElementById('mMath').value),
                science: Number(document.getElementById('mScience').value),
                cs: Number(document.getElementById('mCs').value),
                english: Number(document.getElementById('mEnglish').value)
            };
            saveStudents(all);
            closeModal('marksModal');
            renderReportCard();
            toast('Marks updated');
        }

        renderReportCard();
    </script>
</body>
</html>
